{% extends "base.html" %}

{% block title %}Write Review - HOURX{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto animate-fade-in">
    <div class="card p-0 overflow-hidden">
        <div class="p-8">
            <h2 class="text-2xl font-bold font-heading mb-2">Review Experience</h2>
            <p class="text-muted text-sm mb-6">How was your exchange with <span class="font-bold text-primary">{{
                    reviewee.username }}</span>?</p>

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label">Rating</label>
                    <div class="flex gap-4 items-center">
                        <div class="relative inline-flex w-full">
                            <select name="rating" class="form-control text-lg font-bold text-accent">
                                <option value="5">⭐⭐⭐⭐⭐ 5 - Excellent</option>
                                <option value="4">⭐⭐⭐⭐ 4 - Good</option>
                                <option value="3">⭐⭐⭐ 3 - Average</option>
                                <option value="2">⭐⭐ 2 - Poor</option>
                                <option value="1">⭐ 1 - Terrible</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Comment</label>
                    <textarea name="comment" rows="4" class="form-control resize-none"
                        placeholder="Share details about your experience..." required></textarea>
                </div>

                <div class="flex gap-4 pt-2">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary flex-1 justify-center">Cancel</a>
                    <button type="submit" class="btn btn-primary flex-[2] justify-center">
                        Submit Review
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
