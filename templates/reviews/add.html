{% extends "base.html" %}

{% block title %}Write Review – HourX{% endblock %}

{% block content %}
<div class="container-sm">
    <div class="card">
        <h2 class="text-h2 mb-8">Review Experience</h2>
        <p class="text-body mb-32">How was your exchange with <strong style="color:var(--accent-copper);">{{ reviewee.username }}</strong>?</p>

        <form method="post" class="flex flex-col gap-24">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Rating</label>
                <select name="rating" class="form-select">
                    <option value="5">5 – Excellent</option>
                    <option value="4">4 – Good</option>
                    <option value="3">3 – Average</option>
                    <option value="2">2 – Poor</option>
                    <option value="1">1 – Terrible</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Comment</label>
                <textarea name="comment" rows="4" class="form-textarea" placeholder="Share details about your experience..." required></textarea>
            </div>
            <div class="flex gap-12" style="flex-wrap:wrap;">
                <a href="{% url 'dashboard' %}" class="btn btn-secondary flex-1">Cancel</a>
                <button type="submit" class="btn btn-primary flex-1">Submit Review</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
