{% extends "base.html" %}

{% block title %}Password Changed - HOURX{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md animate-fade-in">
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden text-center">

            <div class="p-8">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-check text-2xl text-green-600"></i>
                </div>

                <h2 class="text-2xl font-bold font-heading text-slate-800 mb-2">Password Changed!</h2>
                <p class="text-slate-500 mb-8">
                    Your password has been set. You may go ahead and log in now.
                </p>

                <a href="{% url 'login' %}"
                    class="block w-full py-3 px-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 bg-[length:200%_auto] hover:bg-[position:right_center] text-white rounded-xl font-semibold shadow-lg shadow-indigo-200 hover:shadow-indigo-300 hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-500">
                    Log In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
