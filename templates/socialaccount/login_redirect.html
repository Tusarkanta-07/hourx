{% extends "base.html" %}

{% block title %}Connecting – HourX{% endblock %}

{% block content %}
<div style="min-height:60vh; display:flex; align-items:center; justify-content:center; padding:24px;">
    <div class="card text-center" style="max-width:400px; width:100%; padding:48px 40px;">
        <span class="material-symbols-outlined" style="font-size:48px; color:var(--accent-blue); animation:spin 1s linear infinite;">progress_activity</span>
        <h2 class="text-h2 mt-16">Connecting...</h2>
        <p class="text-body mt-8">Please wait while we securely connect your account.</p>
        <p class="text-small mt-24">
            If not redirected, <a href="{{ redirect_to }}" style="color:var(--accent-blue);">click here</a>.
        </p>
    </div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script>setTimeout(function() { window.location.href = "{{ redirect_to|escapejs }}"; }, 100);</script>
{% endblock %}
