{% extends "base.html" %}

{% block title %}Meeting Room – HourX{% endblock %}

{% block extra_head %}
<script src="https://meet.jit.si/external_api.js"></script>
{% endblock %}

{% block content %}
<div class="container">
    <div class="flex justify-between items-center mb-24">
        <h1 class="text-h2">Meeting: {{ request_obj.skill.title }}</h1>
        <a href="javascript:history.back()" class="btn btn-secondary btn-sm">Back</a>
    </div>
    <div class="card" style="padding:16px;">
        <div id="jitsi-container" style="height:600px; width:100%; border-radius:var(--radius-md); overflow:hidden; background:var(--bg-secondary);"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        new JitsiMeetExternalAPI('meet.jit.si', {
            roomName: '{{ meeting_room_name }}',
            parentNode: document.querySelector('#jitsi-container'),
            width: '100%', height: '100%',
            configOverwrite: {}, interfaceConfigOverwrite: {}
        });
    });
</script>
{% endblock %}
