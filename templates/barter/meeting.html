{% extends "base.html" %}

{% block title %}Meeting Room - HOURX{% endblock %}

{% block extra_head %}
<!-- Inject Jitsi external API script -->
<script src="https://meet.jit.si/external_api.js"></script>
{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto animate-fade-in">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold font-heading">Meeting: {{ request_obj.skill.title }}</h2>
        <a href="javascript:history.back()" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <div class="card p-4">
        <!-- Dedicated Jitsi Container -->
        <div id="jitsi-container" style="height: 600px; width: 100%; border: 0; border-radius: 12px; overflow: hidden; background: #1a1a1a;"></div>
    </div>
</div>

<!-- Initialization Script -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var domain = 'meet.jit.si';
        var options = {
            roomName: '{{ meeting_room_name }}',
            parentNode: document.querySelector('#jitsi-container'),
            width: '100%',
            height: '100%',
            configOverwrite: {},
            interfaceConfigOverwrite: {}
        };
        var api = new JitsiMeetExternalAPI(domain, options);
    });
</script>
{% endblock %}
