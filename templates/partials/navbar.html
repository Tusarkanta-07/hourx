<nav class="navbar">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <!-- Brand -->
        <a href="{% url 'home' %}" class="nav-brand">HOURX</a>

        <!-- Links (Centered) -->
        <div style="display: flex; gap: 24px;">
            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a>
            <a href="{% url 'skill_list' %}" class="nav-link">Marketplace</a>
            <a href="{% url 'profile' %}" class="nav-link">Profile</a>
            {% else %}
            <a href="{% url 'skill_list' %}" class="nav-link">Explore</a>
            <a href="#how-it-works" class="nav-link">How it Works</a>
            {% endif %}
        </div>

        <!-- Auth Actions -->
        <div style="display: flex; gap: 12px; align-items: center;">
            {% if user.is_authenticated %}
            <div class="badge" style="display: flex; align-items: center; gap: 6px;">
                <i class="fa-regular fa-clock"></i>
                <span>{{ user.time_balance }}h</span>
            </div>
            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-secondary" style="padding: 6px 12px; font-size: 13px;">Sign
                    Out</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}" class="nav-link">Log In</a>
            <a href="{% url 'register' %}" class="btn btn-primary">Get Started</a>
            {% endif %}
        </div>
    </div>
</nav>
